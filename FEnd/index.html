<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Assistant - Manea Mihai Eduard</title>

  <!-- BOOTSTRAP to easily create a website with presets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <!-- TEXTILLATE for text animations -->
  <link rel="stylesheet" href="assets/textillate/animate.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top text -->
  <div class="text-light text text-center py-3" style="font-size: 25px;">
    <h5>Asistent Virtual creat de Manea Mihai Eduard</h5>
  </div>

  <section id="Oval" class="mb-4"> <!-- bottom margin -->

    <div class="row">
      <div class="col-md-1"></div>
      <div class="col-md-10">
        <div class="d-flex justify-content-center align-items-center" style="height: 60vh">
          <div id="VoiceAssistant">

            <!-- Circle animation -->
            <div class="square">
              <span class="circle"></span>
              <span class="circle"></span>
              <span class="circle"></span>
            </div>

          </div>
        </div>

        <!-- Dropdown text box -->
        <div class="text-center mt-5"> <!-- Added margin-top for spacing -->
          <h5 class="text-light text text-center">Salut! Intreaba-ma orice!</h5>

          <!-- Dropdown predefined questions -->
          <select id="questionDropdown" class="form-select w-50 mx-auto mb-3" aria-label="Predefined Questions">
            <option selected disabled>Alege o întrebare!</option>
            <option>Cine a făcut acest Asistent Virtual?</option>
            <option>Care este numele profesorului meu de Micro Procesoare?</option>
            <option>Care este capitala României?</option>
            <option>Cum este vremea astăzi?</option>
            <option>Care este viteza luminii?</option>
            <option>Care este numele tău?</option>
            <option>În ce dată suntem?</option>
            <option>Cât este ceasul?</option>
          </select>

          <!-- NEW: Toggle for ChatGPT integration -->
          <div class="form-check form-switch text-center text-light">
            <input class="form-check-input" type="checkbox" id="useChatGPT" style="transform: scale(1.5);">
            <label class="form-check-label" for="useChatGPT" style="font-size: 1.2rem;">Folosește ChatGPT</label>
          </div>
          <!-- END of toggle -->

          <!-- Submit button -->
          <button id="askButton" class="btn btn-primary mt-3">Întreabă</button>

          <!-- Response box -->
          <div id="responseBox" class="mt-4 text-light text-center" style="display: none;">
            <div class="tlt">
            </div>
          </div>

        </div>
      </div>
      <div class="col-md-1"></div>
    </div>
  </section>

  <!-- BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>

  <!-- TEXTILLATE -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="assets/textillate/jquery.fittext.js"></script>
  <script src="assets/textillate/jquery.lettering.js"></script>
  <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

  <!-- Main script -->
  <script src="main.js"></script>
  <script src="/eel.js"></script>

</body>
</html>
